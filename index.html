<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>QiuPush — Gentle Habit & Focus Companion</title>
  <style>
    /* ============================================================
       1. DESIGN TOKENS & 3 INSTANT PASTEL THEMES
       ============================================================ */
    :root {
      --bg-outer-start: #E4F3FF;
      --bg-outer-mid: #F6ECFA;
      --bg-outer-end: #FFE8F2;
      --bg-cream: #FCF8FC;
      --card-white: #FFFFFF;
      --border-soft: #ECE4F6;

      --primary-soft: #FFE8F2;
      --primary-mid: #FFC2DF;
      --primary-accent: #F472B6;
      --primary-deep: #DB2777;

      --secondary-soft: #E4F3FF;
      --secondary-mid: #B8DEFF;
      --secondary-accent: #5B9BD5;
      --secondary-deep: #2563EB;

      --tertiary-soft: #F2ECFF;
      --tertiary-accent: #9B7EDE;

      --ink-dark: #373145;
      --ink-muted: #756E87;
      --ink-soft: #9B94AD;

      --font-ui: 'Quicksand', 'Nunito', 'Rounded Mplus 1c', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-editorial: 'Georgia', 'Palatino Linotype', 'Book Antiqua', serif;
    }

    /* Theme 2: Baby Blue Sky */
    body[data-theme="blue"] {
      --bg-outer-start: #D9EEFF;
      --bg-outer-mid: #EAF6FF;
      --bg-outer-end: #E3F0FF;
      --bg-cream: #F7FBFF;
      --border-soft: #DCEBFA;

      --primary-soft: #E0F1FF;
      --primary-mid: #A8D6FF;
      --primary-accent: #4A90E2;
      --primary-deep: #1D63B8;

      --secondary-soft: #EBF7FF;
      --secondary-mid: #BCE0FF;
      --secondary-accent: #5B9BD5;
      --secondary-deep: #2563EB;

      --tertiary-soft: #E8EEFF;
      --tertiary-accent: #6B8CE8;
    }

    /* Theme 3: Krem Cokelat (Cozy Latte) */
    body[data-theme="latte"] {
      --bg-outer-start: #F6ECE1;
      --bg-outer-mid: #EFE2D3;
      --bg-outer-end: #F8EFE6;
      --bg-cream: #FDF9F4;
      --border-soft: #EADCCB;

      --primary-soft: #F5E6D8;
      --primary-mid: #DFC2A6;
      --primary-accent: #B8845B;
      --primary-deep: #8C5832;

      --secondary-soft: #EFE6DD;
      --secondary-mid: #D8C7B8;
      --secondary-accent: #8E735B;
      --secondary-deep: #6B513B;

      --tertiary-soft: #F3EAE0;
      --tertiary-accent: #A37D5D;

      --ink-dark: #42352B;
      --ink-muted: #7D6B5D;
      --ink-soft: #A39284;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-ui);
      background: linear-gradient(145deg, var(--bg-outer-start) 0%, var(--bg-outer-mid) 50%, var(--bg-outer-end) 100%);
      color: var(--ink-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      line-height: 1.5;
      font-size: 14px;
    }

    /* Mobile-First 430px App Shell */
    .app-shell {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background-color: var(--bg-cream);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 22px 55px rgba(55, 49, 69, 0.14);
      overflow-x: hidden;
    }

    @media (min-width: 480px) {
      .app-shell {
        min-height: 92vh;
        margin: 4vh 0;
        border-radius: 36px;
        border: 6px solid #FFFFFF;
      }
      .bottom-nav {
        border-bottom-left-radius: 30px;
        border-bottom-right-radius: 30px;
      }
    }

    /* Header */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 30;
      padding: 15px 16px 12px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1.5px solid var(--border-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo-box {
      width: 42px;
      height: 42px;
      border-radius: 15px;
      background: linear-gradient(135deg, var(--secondary-soft) 0%, var(--primary-soft) 100%);
      border: 1.5px solid #FFFFFF;
      box-shadow: 0 6px 16px rgba(244, 114, 182, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-title {
      font-family: var(--font-editorial);
      font-size: 21px;
      font-weight: 700;
      color: var(--ink-dark);
      letter-spacing: -0.2px;
      line-height: 1.1;
    }

    .brand-sub {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--ink-muted);
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .streak-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 11px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--primary-soft), var(--secondary-soft));
      border: 1.5px solid var(--border-soft);
      font-size: 12px;
      font-weight: 800;
      color: var(--primary-deep);
    }

    .sound-btn {
      width: 36px;
      height: 36px;
      border-radius: 13px;
      border: 1.5px solid var(--border-soft);
      background: var(--secondary-soft);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .sound-btn:active {
      transform: scale(0.92);
    }

    /* Main Content */
    .main-content {
      flex: 1;
      padding: 14px 16px 96px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Cards & Typography */
    .soft-card {
      background: var(--card-white);
      border-radius: 24px;
      padding: 16px;
      border: 1.5px solid var(--border-soft);
      box-shadow: 0 8px 24px rgba(55, 49, 69, 0.05);
    }

    .editorial-heading {
      font-family: var(--font-editorial);
      font-size: 20px;
      font-weight: 700;
      color: var(--ink-dark);
      line-height: 1.25;
    }

    .quote-card {
      background: linear-gradient(135deg, var(--secondary-soft) 0%, #FFFFFF 52%, var(--primary-soft) 100%);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .quote-editorial-text {
      font-family: var(--font-editorial);
      font-style: italic;
      font-size: 15px;
      font-weight: 400;
      color: var(--ink-dark);
      margin-top: 8px;
      line-height: 1.55;
    }

    .quote-actions {
      display: flex;
      flex-direction: column;
      gap: 7px;
      flex-shrink: 0;
    }

    .mini-square-btn {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      border: 1.5px solid var(--border-soft);
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .mini-square-btn:active {
      transform: scale(0.9);
    }

    /* Pill Tags */
    .pill-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 11px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.2px;
    }

    .pill-primary {
      background: var(--primary-soft);
      color: var(--primary-deep);
      border: 1px solid var(--primary-mid);
    }

    .pill-secondary {
      background: var(--secondary-soft);
      color: var(--secondary-deep);
      border: 1px solid var(--secondary-mid);
    }

    .pill-tertiary {
      background: var(--tertiary-soft);
      color: var(--tertiary-accent);
      border: 1px solid var(--border-soft);
    }

    /* Mood Bar Strip */
    .mood-strip {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 11px 13px;
      border: 1.5px solid var(--border-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .mood-options {
      display: flex;
      gap: 6px;
    }

    .mood-chip {
      padding: 6px 10px;
      border-radius: 13px;
      border: 1.5px solid var(--border-soft);
      background: var(--bg-cream);
      color: var(--ink-muted);
      font-family: inherit;
      font-size: 11px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mood-chip.active {
      background: linear-gradient(135deg, var(--secondary-soft), var(--primary-soft));
      border-color: var(--primary-accent);
      color: var(--ink-dark);
      transform: translateY(-1px);
    }

    /* Avatar Sanctuary Card */
    .avatar-card {
      border-radius: 28px;
      padding: 16px;
      border: 2px solid #FFFFFF;
      background: linear-gradient(155deg, var(--primary-soft) 0%, var(--tertiary-soft) 52%, var(--secondary-soft) 100%);
      box-shadow: 0 12px 28px rgba(55, 49, 69, 0.08);
      position: relative;
      overflow: hidden;
    }

    .avatar-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }

    .stage-badge {
      background: rgba(255, 255, 255, 0.9);
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 800;
      color: var(--ink-dark);
    }

    .avatar-action-group {
      display: flex;
      gap: 6px;
    }

    .mini-pill-btn {
      background: rgba(255, 255, 255, 0.92);
      border: 1.5px solid var(--border-soft);
      padding: 5px 10px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 800;
      color: var(--primary-deep);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .avatar-stage-area {
      text-align: center;
      padding: 4px 0 6px;
      cursor: pointer;
      user-select: none;
    }

    .avatar-speech {
      display: inline-block;
      margin-top: 6px;
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.94);
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink-dark);
      box-shadow: 0 4px 12px rgba(55, 49, 69, 0.06);
    }

    .xp-box {
      margin-top: 10px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 17px;
      padding: 10px 13px;
    }

    .xp-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 800;
      margin-bottom: 6px;
      color: var(--ink-muted);
    }

    .xp-track {
      width: 100%;
      height: 11px;
      border-radius: 999px;
      background: var(--border-soft);
      overflow: hidden;
    }

    .xp-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--secondary-accent) 0%, var(--primary-accent) 100%);
      transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Section Header */
    .sec-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
      margin-bottom: 8px;
    }

    .sec-title {
      font-family: var(--font-editorial);
      font-size: 17px;
      font-weight: 700;
      color: var(--ink-dark);
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .sec-meta {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--ink-muted);
    }

    /* Stacked Priority Focus Deck */
    .deck-wrapper {
      position: relative;
      padding-top: 4px;
      padding-bottom: 10px;
    }

    .deck-layer-back {
      position: absolute;
      left: 16px;
      right: 16px;
      top: 14px;
      bottom: 0;
      border-radius: 24px;
      background: var(--secondary-soft);
      border: 1.5px solid var(--secondary-mid);
    }

    .deck-layer-mid {
      position: absolute;
      left: 8px;
      right: 8px;
      top: 9px;
      bottom: 5px;
      border-radius: 24px;
      background: var(--primary-soft);
      border: 1.5px solid var(--primary-mid);
    }

    .deck-top-card {
      position: relative;
      background: #FFFFFF;
      border-radius: 24px;
      padding: 17px;
      border: 1.5px solid var(--border-soft);
      box-shadow: 0 10px 24px rgba(55, 49, 69, 0.07);
    }

    .card-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .task-card-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--ink-dark);
      margin-bottom: 5px;
      line-height: 1.35;
    }

    .task-card-status {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink-muted);
      margin-bottom: 15px;
    }

    /* Buttons */
    .btn-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-soft-secondary {
      padding: 12px 13px;
      border-radius: 16px;
      border: 1.5px solid var(--secondary-mid);
      background: var(--secondary-soft);
      color: var(--secondary-deep);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .btn-gradient-main {
      padding: 12px 13px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, var(--secondary-accent) 0%, var(--primary-accent) 100%);
      color: #FFFFFF;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 6px 16px rgba(55, 49, 69, 0.16);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .btn-soft-secondary:active,
    .btn-gradient-main:active {
      transform: scale(0.96);
    }

    /* Habit Rows */
    .habit-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .habit-item-btn {
      width: 100%;
      background: #FFFFFF;
      border: 1.5px solid var(--border-soft);
      border-radius: 20px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .habit-item-btn:active {
      transform: scale(0.98);
    }

    .habit-item-btn.done {
      background: linear-gradient(135deg, var(--secondary-soft) 0%, var(--primary-soft) 100%);
      border-color: var(--secondary-mid);
    }

    .habit-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .habit-icon-box {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      background: var(--secondary-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .habit-item-btn.done .habit-icon-box {
      background: #FFFFFF;
    }

    .habit-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--ink-dark);
    }

    .habit-item-btn.done .habit-title {
      text-decoration: line-through;
      color: var(--ink-muted);
    }

    .habit-xp-tag {
      font-size: 11px;
      font-weight: 700;
      color: var(--secondary-accent);
    }

    .check-circle {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      border: 2px solid var(--border-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .habit-item-btn.done .check-circle {
      background: linear-gradient(135deg, var(--secondary-accent), var(--primary-accent));
      border-color: transparent;
    }

    /* Inputs & Forms */
    .pastel-input,
    .pastel-select,
    .pastel-textarea {
      width: 100%;
      padding: 11px 13px;
      border-radius: 15px;
      border: 1.5px solid var(--border-soft);
      background: var(--bg-cream);
      color: var(--ink-dark);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      outline: none;
    }

    .pastel-input:focus,
    .pastel-select:focus,
    .pastel-textarea:focus {
      border-color: var(--primary-accent);
      background: #FFFFFF;
    }

    .inline-form {
      display: flex;
      gap: 8px;
    }

    .brain-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 12px;
      border-radius: 14px;
      background: var(--bg-cream);
      border: 1px solid var(--border-soft);
      font-size: 12.5px;
      font-weight: 600;
      margin-top: 8px;
    }

    /* Filter Pills */
    .filter-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .filter-pill {
      padding: 7px 14px;
      border-radius: 999px;
      border: 1.5px solid var(--border-soft);
      background: #FFFFFF;
      color: var(--ink-muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .filter-pill.active {
      background: linear-gradient(135deg, var(--secondary-accent), var(--primary-accent));
      color: #FFFFFF;
      border-color: transparent;
    }

    /* Bottom Navigation (5 Tabs) */
    .bottom-nav {
      position: sticky;
      bottom: 0;
      z-index: 30;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1.5px solid var(--border-soft);
      padding: 8px 6px 10px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 3px;
    }

    .nav-btn {
      border: none;
      background: transparent;
      border-radius: 16px;
      padding: 6px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--ink-muted);
      font-family: inherit;
      font-size: 10.5px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-btn.active {
      background: linear-gradient(135deg, var(--secondary-soft) 0%, var(--primary-soft) 100%);
      color: var(--ink-dark);
      transform: translateY(-2px);
    }

    /* Chill Zone Mini Teka-Teki & Memory Game */
    .riddle-card-box {
      margin-top: 10px;
      padding: 13px;
      border-radius: 18px;
      background: linear-gradient(145deg, var(--bg-cream) 0%, #FFFFFF 100%);
      border: 1.5px dashed var(--secondary-mid);
    }

    .riddle-meta-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }

    .riddle-question {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--ink-dark);
      margin: 9px 0 10px;
      line-height: 1.45;
    }

    .riddle-feedback {
      margin-top: 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--primary-deep);
      min-height: 18px;
    }

    .memory-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .memory-tile {
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      border: 2px solid #FFFFFF;
      background: linear-gradient(135deg, var(--secondary-soft), var(--primary-soft));
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.2s ease;
    }

    .memory-tile.open {
      background: #FFFFFF;
      border-color: var(--primary-mid);
    }

    /* Animations */
    @keyframes floatIdle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    @keyframes squishBounce {
      0% { transform: scale(1, 1); }
      30% { transform: scale(1.16, 0.84) translateY(5px); }
      60% { transform: scale(0.92, 1.1) translateY(-11px); }
      100% { transform: scale(1, 1); }
    }

    @keyframes tailWag {
      0%, 100% { transform: rotate(-6deg); }
      50% { transform: rotate(9deg); }
    }

    @keyframes earWiggle {
      0%, 90%, 100% { transform: rotate(0deg); }
      94% { transform: rotate(-4deg); }
      97% { transform: rotate(4deg); }
    }

    @keyframes cardDraw {
      0% { opacity: 0; transform: translateY(12px) rotate(-2deg) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
    }

    @keyframes floatUpFade {
      0% { opacity: 1; transform: translateY(0) scale(0.9); }
      100% { opacity: 0; transform: translateY(-48px) scale(1.1); }
    }

    .avatar-idle {
      animation: floatIdle 3.2s ease-in-out infinite;
    }

    .avatar-bounce {
      animation: squishBounce 0.52s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .svg-tail {
      transform-origin: 96px 96px;

  <script>
    // ============================================================
    // 1. BRAND CONFIG & RESTRICTED WEB AUDIO SOUND ENGINE
    //    Sounds play ONLY on: 'pet' (avatar tap), 'xp', and 'levelup'.
    // ============================================================
    const APP_BRAND_NAME = 'QiuPush';
    const STORAGE_KEY = 'QiuPush_pastel_companion_v1';

    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // 5 selectable ready-made avatars with distinct tap sounds & independent XP
    const READY_AVATARS = [
      {
        id: 'mochi_cat',
        name: 'Kucing Mochi',
        species: 'kitten',
        soundKey: 'cat',
        fur: '#FFF5FA',
        furShade: '#F7DCEB',
        accent: '#F472B6',
        speech: 'Meow~ Kucing Mochi siap nemenin kamu fokus pelan-pelan!'
      },
      {
        id: 'berry_bunny',
        name: 'Kelinci Berry',
        species: 'bunny',
        soundKey: 'bunny',
        fur: '#FBF7FF',
        furShade: '#EAE0FA',
        accent: '#A78BFA',
        speech: 'Hop-hop! Kelinci Berry ikut menyemangati langkah kecilmu!'
      },
      {
        id: 'sky_bear',
        name: 'Beruang Sky',
        species: 'bear',
        soundKey: 'bear',
        fur: '#EEF7FF',
        furShade: '#CFE7FC',
        accent: '#5B9BD5',
        speech: 'Hum~ Beruang Sky nemenin kamu istirahat & berprogres.'
      },
      {
        id: 'peach_fox',
        name: 'Rubah Peach',
        species: 'kitten',
        soundKey: 'fox',
        fur: '#FFF2EA',
        furShade: '#FFC9AD',
        accent: '#FB7185',
        speech: 'Yip-yip! Rubah Peach bantu jaga mood tetap cerah!'
      },
      {
        id: 'butter_chick',
        name: 'Anak Ayam Butter',
        species: 'chick',
        soundKey: 'chick',
        fur: '#FFFDF0',
        furShade: '#FDE047',
        accent: '#EAB308',
        speech: 'Piwit-piwit! Satu langkah kecil sudah bikin hari ringan!'
      }
    ];

    function createEmptyAvatarXpMap() {
      return {
        mochi_cat: 0,
        berry_bunny: 0,
        sky_bear: 0,
        peach_fox: 0,
        butter_chick: 0
      };
    }

    function playKawaiiSound(type) {
      // Strictly allow sound ONLY on avatar tap ('pet'), XP gain ('xp'), and level up ('levelup')
      if (!['pet', 'xp', 'levelup'].includes(type)) return;
      if (!state || !state.soundEnabled) return;

      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;

        if (type === 'xp') {
          const xpNotes = [587.33, 783.99, 1046.5];
          xpNotes.forEach((freq, i) => {
            const xpOsc = ctx.createOscillator();
            const xpGain = ctx.createGain();
            xpOsc.type = 'triangle';
            const t0 = now + i * 0.065;
            xpOsc.frequency.setValueAtTime(freq, t0);
            xpGain.gain.setValueAtTime(0.001, t0);
            xpGain.gain.linearRampToValueAtTime(0.08, t0 + 0.015);
            xpGain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.22);
            xpOsc.connect(xpGain);
            xpGain.connect(ctx.destination);
            xpOsc.start(t0);
            xpOsc.stop(t0 + 0.24);
          });
        } else if (type === 'levelup') {
          const lvlMelody = [523.25, 659.25, 783.99, 1046.5, 1318.5];
          lvlMelody.forEach((freq, i) => {
            const lvlOsc = ctx.createOscillator();
            const lvlGain = ctx.createGain();
            lvlOsc.type = 'sine';
            const start = now + i * 0.09;
            const dur = i === lvlMelody.length - 1 ? 0.42 : 0.16;
            lvlOsc.frequency.setValueAtTime(freq, start);
            lvlGain.gain.setValueAtTime(0.001, start);
            lvlGain.gain.linearRampToValueAtTime(0.11, start + 0.02);
            lvlGain.gain.exponentialRampToValueAtTime(0.001, start + dur);
            lvlOsc.connect(lvlGain);
            lvlGain.connect(ctx.destination);
            lvlOsc.start(start);
            lvlOsc.stop(start + dur + 0.02);
          });
        } else if (type === 'pet') {
          const activeAv = getActiveReadyAvatar();
          const sk = activeAv.soundKey;

          if (sk === 'cat') {
            // 1. Kucing Mochi: soft filtered meow glide
            const catOsc = ctx.createOscillator();
            const catFilter = ctx.createBiquadFilter();
            const catGain = ctx.createGain();
            catOsc.type = 'triangle';
            catFilter.type = 'lowpass';
            catFilter.frequency.setValueAtTime(1150, now);
            catOsc.frequency.setValueAtTime(430, now);
            catOsc.frequency.exponentialRampToValueAtTime(710, now + 0.14);
            catOsc.frequency.exponentialRampToValueAtTime(350, now + 0.42);
            catGain.gain.setValueAtTime(0.001, now);
            catGain.gain.linearRampToValueAtTime(0.15, now + 0.08);
            catGain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
            catOsc.connect(catFilter);
            catFilter.connect(catGain);
            catGain.connect(ctx.destination);
            catOsc.start(now);
            catOsc.stop(now + 0.46);
          } else if (sk === 'bunny') {
            // 2. Kelinci Berry: cheerful double hop
            const bunnyHops = [
              { start: 0, f1: 260, f2: 490, dur: 0.11 },
              { start: 0.13, f1: 340, f2: 640, dur: 0.13 }
            ];
            bunnyHops.forEach((h) => {
              const hopOsc = ctx.createOscillator();
              const hopGain = ctx.createGain();
              hopOsc.type = 'sine';
              hopOsc.frequency.setValueAtTime(h.f1, now + h.start);
              hopOsc.frequency.exponentialRampToValueAtTime(h.f2, now + h.start + h.dur);
              hopGain.gain.setValueAtTime(0.001, now + h.start);
              hopGain.gain.linearRampToValueAtTime(0.14, now + h.start + 0.02);
              hopGain.gain.exponentialRampToValueAtTime(0.001, now + h.start + h.dur);
              hopOsc.connect(hopGain);
              hopGain.connect(ctx.destination);
              hopOsc.start(now + h.start);
              hopOsc.stop(now + h.start + h.dur + 0.02);
            });
          } else if (sk === 'bear') {
            // 3. Beruang Sky: warm low-mid hum
            const bearOsc = ctx.createOscillator();
            const bearFilter = ctx.createBiquadFilter();
            const bearGain = ctx.createGain();
            bearOsc.type = 'sine';
            bearFilter.type = 'lowpass';
            bearFilter.frequency.setValueAtTime(620, now);
            bearOsc.frequency.setValueAtTime(175, now);
            bearOsc.frequency.linearRampToValueAtTime(215, now + 0.18);
            bearOsc.frequency.linearRampToValueAtTime(165, now + 0.38);
            bearGain.gain.setValueAtTime(0.001, now);
            bearGain.gain.linearRampToValueAtTime(0.16, now + 0.06);
            bearGain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            bearOsc.connect(bearFilter);
            bearFilter.connect(bearGain);
            bearGain.connect(ctx.destination);
            bearOsc.start(now);
            bearOsc.stop(now + 0.41);
          } else if (sk === 'fox') {
            // 4. Rubah Peach: nimble rising yip
            const foxOsc = ctx.createOscillator();
            const foxGain = ctx.createGain();
            foxOsc.type = 'triangle';
            foxOsc.frequency.setValueAtTime(480, now);
            foxOsc.frequency.exponentialRampToValueAtTime(860, now + 0.16);
            foxGain.gain.setValueAtTime(0.001, now);
            foxGain.gain.linearRampToValueAtTime(0.13, now + 0.03);
            foxGain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
            foxOsc.connect(foxGain);
            foxGain.connect(ctx.destination);
            foxOsc.start(now);
            foxOsc.stop(now + 0.24);
          } else {
            // 5. Anak Ayam Butter: gentle double chirp ("piwit-piwit")
            const chickNotes = [0, 0.14];
            chickNotes.forEach((offset) => {
              const chkOsc = ctx.createOscillator();
              const chkGain = ctx.createGain();
              chkOsc.type = 'sine';
              chkOsc.frequency.setValueAtTime(760, now + offset);
              chkOsc.frequency.exponentialRampToValueAtTime(980, now + offset + 0.08);
              chkGain.gain.setValueAtTime(0.001, now + offset);
              chkGain.gain.linearRampToValueAtTime(0.12, now + offset + 0.015);
              chkGain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.1);
              chkOsc.connect(chkGain);
              chkGain.connect(ctx.destination);
              chkOsc.start(now + offset);
              chkOsc.stop(now + offset + 0.11);
            });
          }
        }
      } catch (err) {
        // Ignore restricted audio errors on mobile browsers
      }
    }

    // Local date helper (YYYY-MM-DD) so day counter accurately tracks calendar days
    function getLocalDateStr(offsetDays = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function parseDateStrToDayNumber(dateStr) {
      if (!dateStr || typeof dateStr !== 'string') return null;
      const parts = dateStr.split('-').map(Number);
      if (parts.length !== 3 || parts.some(Number.isNaN)) return null;
      // Use UTC midnight for exact whole-day difference without DST drift
      return Math.floor(Date.UTC(parts[0], parts[1] - 1, parts[2]) / 86400000);
    }

    function createShuffledRiddleQueue(excludeIndex = null) {
      const indices = MINI_RIDDLES.map((_, i) => i);
      for (let i = indices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [indices[i], indices[j]] = [indices[j], indices[i]];
      }
      if (excludeIndex !== null && indices.length > 1 && indices[0] === excludeIndex) {
        const swapIdx = indices.findIndex((val) => val !== excludeIndex);
        if (swapIdx > 0) {
          [indices[0], indices[swapIdx]] = [indices[swapIdx], indices[0]];
        }
      }
      return indices;
    }

    function normalizeAvatarXpMap(rawMap, activeId, fallbackXp) {
      const baseMap = createEmptyAvatarXpMap();
      if (rawMap && typeof rawMap === 'object') {
        READY_AVATARS.forEach((av) => {
          const val = Number(rawMap[av.id]);
          if (!Number.isNaN(val) && val >= 0) {
            baseMap[av.id] = Math.floor(val);
          }
        });
      } else if (typeof fallbackXp === 'number' && fallbackXp > 0) {
        const targetId = READY_AVATARS.some((a) => a.id === activeId) ? activeId : 'mochi_cat';
        baseMap[targetId] = Math.max(0, Math.floor(fallbackXp));
      }
      return baseMap;
    }

    function syncDailyStreak(targetState, simulatedTodayStr = null) {
      const todayStr = simulatedTodayStr || getLocalDateStr(0);
      const todayNum = parseDateStrToDayNumber(todayStr);

      if (!targetState.firstUseDate) {
        targetState.firstUseDate = todayStr;
        targetState.lastActiveDate = todayStr;
        targetState.streak = 1;
        return;
      }

      const lastNum = parseDateStrToDayNumber(targetState.lastActiveDate);
      if (lastNum === null || todayNum === null) {
        targetState.firstUseDate = targetState.firstUseDate || todayStr;
        targetState.lastActiveDate = todayStr;
        targetState.streak = Math.max(1, Number(targetState.streak) || 1);
        return;
      }

      const diffDays = todayNum - lastNum;
      if (diffDays === 0) {
        // Same day: keep current streak intact
        targetState.streak = Math.max(1, Number(targetState.streak) || 1);
      } else if (diffDays === 1) {
        // Consecutive next day: increment streak automatically
        targetState.streak = Math.max(1, Number(targetState.streak) || 1) + 1;
        targetState.lastActiveDate = todayStr;
      } else if (diffDays > 1) {
        // Missed 1+ days: reset streak cleanly to 1 for the new active day
        targetState.streak = 1;
        targetState.lastActiveDate = todayStr;
      } else {
        // Clock moved backwards slightly: align lastActiveDate safely
        targetState.lastActiveDate = todayStr;
        targetState.streak = Math.max(1, Number(targetState.streak) || 1);
      }
    }

      const valid = Array.isArray(rawQueue)

      if (valid.length > 0) return valid;
      return createShuffledRiddleQueue(currentIndex);
    }

          const readyId = READY_AVATARS.some((a) => a.id === parsed.readyAvatarId)

          const xpMap = normalizeAvatarXpMap(parsed.avatarXpMap, readyId, parsed.xp);

          const safeIdx = typeof parsed.riddleIndex === 'number'
            ? ((parsed.riddleIndex % MINI_RIDDLES.length) + MINI_RIDDLES.length) % MINI_RIDDLES.length

          const merged = {
            ...defaultState,
            ...parsed,
            readyAvatarId: readyId,
            avatarSpecies: (READY_AVATARS.find((a) => a.id === readyId) || READY_AVATARS[0]).species,
            avatarXpMap: xpMap,
            xp: activeXp,
            riddleIndex: safeIdx,
            riddleQueue: normalizeRiddleQueue(parsed.riddleQueue, safeIdx),
            profile: { ...defaultState.profile, ...(parsed.profile || {}) },
            tasks: Array.isArray(parsed.tasks) ? parsed.tasks : defaultState.tasks,
            habits: Array.isArray(parsed.habits) ? parsed.habits : defaultState.habits,
            brainDumpNotes: Array.isArray(parsed.brainDumpNotes) ? parsed.brainDumpNotes : [],
            hallOfFame: Array.isArray(parsed.hallOfFame) ? parsed.hallOfFame : []
          };

          syncDailyStreak(merged);
          return merged;

      } catch (err) {
        console.error('Gagal memuat database lokal:', err);

      fresh.riddleIndex = fresh.riddleQueue[0] || 0;
      syncDailyStreak(fresh);
      return fresh;

    // ============================================================
    // 5. PRIORITY FOCUS DECK LOGIC (HIGH -> MEDIUM -> LOW)
    // ============================================================
    function getActivePriorityTier() {
      const unfinished = state.tasks.filter(t => t.status !== 'Selesai');
      if (unfinished.some(t => t.priority === 'High')) return 'High';
      if (unfinished.some(t => t.priority === 'Medium')) return 'Medium';
      if (unfinished.some(t => t.priority === 'Low')) return 'Low';
      return null;
    }

    function getCurrentFocusCard() {
      const tier = getActivePriorityTier();
      if (!tier) return null;
      const pool = state.tasks.filter(t => t.status !== 'Selesai' && t.priority === tier);
      let current = pool.find(t => t.id === state.activeCardId);
      if (!current && pool.length > 0) {
        current = pool[0];
        state.activeCardId = current.id;
        saveState();
      }
      return { card: current, tier, remainingInTier: pool.length };
    }

    function shuffleFocusCard() {
      const tier = getActivePriorityTier();
      if (!tier) return;
      const pool = state.tasks.filter(t => t.status !== 'Selesai' && t.priority === tier);
      if (pool.length <= 1) {
        showToast(`Hanya tersisa 1 tugas di prioritas ${tier}. Yuk selesaikan!`);
        return;
      }
      const others = pool.filter(t => t.id !== state.activeCardId);
      const next = others[Math.floor(Math.random() * others.length)];
      state.activeCardId = next.id;
      saveState();
      renderApp(true);
    }

    function completeFocusCard(event) {
      const focus = getCurrentFocusCard();
      if (!focus || !focus.card) return;
      const task = state.tasks.find(t => t.id === focus.card.id);
      if (task) task.status = 'Selesai';
      const activeAv = getActiveReadyAvatar();
      addXP(25, event);
      showToast(`Tugas selesai! +25 XP untuk ${activeAv.name}`);
      saveState();
      renderApp(true);
    }

    // ============================================================
    // 6. PER-AVATAR XP, MOOD CHECK-IN, HABITS, BRAIN DUMP & CHILL
    // ============================================================
    function addXP(amount, event) {
      if (!state.avatarXpMap) state.avatarXpMap = createEmptyAvatarXpMap();
      const activeAv = getActiveReadyAvatar();
      const targetId = activeAv.id;

      const prevAvXp = getAvatarXP(targetId);
      const oldStage = getAvatarStage(prevAvXp, targetId).stage;

      const nextAvXp = Math.max(0, prevAvXp + amount);
      state.avatarXpMap[targetId] = nextAvXp;
      state.xp = nextAvXp;

      const newStage = getAvatarStage(nextAvXp, targetId).stage;

      if (amount > 0) {
        if (newStage > oldStage) {
          playKawaiiSound('levelup');
        } else {
          playKawaiiSound('xp');
        }
      }

      if (event && event.clientX) {
        const floater = document.createElement('div');
        floater.className = 'xp-floater';
        floater.textContent = amount > 0 ? `+${amount} XP (${activeAv.name.split(' ')[0]})` : `${amount} XP`;
        floater.style.left = `${Math.min(window.innerWidth - 135, Math.max(16, event.clientX - 24))}px`;
        floater.style.top = `${Math.max(40, event.clientY - 18)}px`;
        document.body.appendChild(floater);
        setTimeout(() => floater.remove(), 900);
      }

      if (newStage > oldStage) {
        setTimeout(() => {
          showToast(`Selamat! ${activeAv.name} tumbuh ke Tahap ${newStage}!`);
        }, 320);
      }
    }

    // Chill Zone Actions (Non-repeating shuffled Mini Teka-Teki deck)
    function ensureRiddleQueuePosition() {
      if (!Array.isArray(state.riddleQueue) || state.riddleQueue.length === 0) {
        state.riddleQueue = createShuffledRiddleQueue(null);
      }
      const pos = state.riddleQueue.indexOf(state.riddleIndex);
      if (pos === -1) {
        state.riddleIndex = state.riddleQueue[0];
        return 0;
      }
      return pos;
    }

    function spinSelfCare() {
      const next = SELF_CARE_PROMPTS[Math.floor(Math.random() * SELF_CARE_PROMPTS.length)];
      state.chillPrompt = next;
      saveState();
      renderApp();
    }

    function checkMiniRiddle(event) {
      if (event) event.preventDefault();
      const inputEl = document.getElementById('riddleAnswerInput');
      const feedbackEl = document.getElementById('riddleFeedbackText');
      if (!inputEl) return;

      const guess = inputEl.value.trim().toLowerCase();
      if (!guess) {
        if (feedbackEl) feedbackEl.textContent = 'Ketik dulu jawabanmu ya!';
        return;
      }

      const currentRiddle = MINI_RIDDLES[(state.riddleIndex || 0) % MINI_RIDDLES.length];
      const isCorrect = currentRiddle.answers.some((ans) => guess === ans || guess.includes(ans));

      if (isCorrect) {
        const activeAv = getActiveReadyAvatar();
        state.riddlesSolved = (state.riddlesSolved || 0) + 1;
        inputEl.value = '';
        addXP(10, event);
        saveState();
        renderApp();
        const updatedFb = document.getElementById('riddleFeedbackText');
        if (updatedFb) updatedFb.textContent = `Benar banget! +10 XP untuk ${activeAv.name}!`;
      } else {
        if (feedbackEl) feedbackEl.textContent = 'Belum tepat, coba lagi atau klik Petunjuk!';
      }
    }

    function showMiniRiddleHint() {
      const currentRiddle = MINI_RIDDLES[(state.riddleIndex || 0) % MINI_RIDDLES.length];
      const feedbackEl = document.getElementById('riddleFeedbackText');
      if (feedbackEl) feedbackEl.textContent = `Petunjuk: ${currentRiddle.hint}`;
    }

    function nextMiniRiddle() {
      const currentIdx = (state.riddleIndex || 0) % MINI_RIDDLES.length;
      const pos = ensureRiddleQueuePosition();
      const nextPos = pos + 1;

      if (nextPos < state.riddleQueue.length) {
        state.riddleIndex = state.riddleQueue[nextPos];
      } else {
        // Reshuffle full 26-riddle deck without immediately repeating the last question
        state.riddleQueue = createShuffledRiddleQueue(currentIdx);
        state.riddleIndex = state.riddleQueue[0];
        showToast('Semua teka-teki sudah diputar, dek diacak ulang!');
      }

      saveState();
      renderApp();
      const inputEl = document.getElementById('riddleAnswerInput');
      const feedbackEl = document.getElementById('riddleFeedbackText');
      if (inputEl) inputEl.value = '';
      if (feedbackEl) feedbackEl.textContent = '';
    }

    function initMemoryGame(shouldRender = true) {
      const symbols = ['water', 'book', 'star', 'moon', 'heart', 'paw'];
      const deck = [...symbols, ...symbols].sort(() => Math.random() - 0.5);
      state.memoryCards = deck;
      state.memoryFlipped = [];
      state.memoryMatched = [];
      saveState();
      if (shouldRender) renderApp();
    }

    function flipMemoryCard(idx) {
      if (state.memoryFlipped.length >= 2) return;
      if (state.memoryFlipped.includes(idx) || state.memoryMatched.includes(idx)) return;

      state.memoryFlipped.push(idx);
      renderApp();

      if (state.memoryFlipped.length === 2) {
        const [a, b] = state.memoryFlipped;
        if (state.memoryCards[a] === state.memoryCards[b]) {
          state.memoryMatched.push(a, b);
          state.memoryFlipped = [];
          saveState();
          if (state.memoryMatched.length === state.memoryCards.length) {
            showToast('Hebat! Semua kartu cocok!');
          }
          setTimeout(() => renderApp(), 260);
        } else {
          setTimeout(() => {
            state.memoryFlipped = [];
            renderApp();
          }, 650);
        }
      }
    }

    function toggleBreakTimer() {
      if (state.breakTimerRunning) {
        state.breakTimerRunning = false;
        clearInterval(breakInterval);
        renderApp();
        return;
      }
      if (state.breakSecondsLeft <= 0) state.breakSecondsLeft = 300;
      state.breakTimerRunning = true;
      renderApp();
      breakInterval = setInterval(() => {
        if (!state.breakTimerRunning) {
          clearInterval(breakInterval);
          return;
        }
        state.breakSecondsLeft -= 1;
        if (state.breakSecondsLeft <= 0) {
          state.breakSecondsLeft = 0;
          state.breakTimerRunning = false;
          clearInterval(breakInterval);
          showToast('Waktu istirahat 5 menit selesai! Siap lanjut pelan-pelan?');
        }
        const timerText = document.getElementById('breakTimerDisplay');
        if (timerText) {
          timerText.textContent = formatSeconds(state.breakSecondsLeft);
        } else {
          renderApp();
        }
      }, 1000);
    }

    function resetBreakTimer() {
      state.breakTimerRunning = false;
      clearInterval(breakInterval);
      state.breakSecondsLeft = 300;
      renderApp();
    }

    function formatSeconds(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function toggleSound() {

    function downloadRecapPNG() {
      const svgEl = document.querySelector('#recapSvgHolder svg');
      if (!svgEl) return;

      const activeAv = getActiveReadyAvatar();
      const avXp = getAvatarXP(activeAv.id);
      const stageInfo = getAvatarStage(avXp, activeAv.id);
      const doneTasks = state.tasks.filter(t => t.status === 'Selesai').length;
      const doneHabits = state.habits.filter(h => h.doneToday).length;
      const moodLabel = MOOD_CONFIG[state.todayMood]?.label || 'Santai Aja';

      const canvas = document.createElement('canvas');
      canvas.width = 720;
      canvas.height = 960;
      const ctx = canvas.getContext('2d');

      const bgGrad = ctx.createLinearGradient(0, 0, 720, 960);
      if (state.theme === 'blue') {
        bgGrad.addColorStop(0, '#D9EEFF');
        bgGrad.addColorStop(0.5, '#F4FAFF');
        bgGrad.addColorStop(1, '#DCEEFF');
      } else if (state.theme === 'latte') {
        bgGrad.addColorStop(0, '#F6ECE1');
        bgGrad.addColorStop(0.5, '#FDF9F4');
        bgGrad.addColorStop(1, '#EFE2D3');
      } else {
        bgGrad.addColorStop(0, '#E4F3FF');
        bgGrad.addColorStop(0.5, '#FCF8FC');
        bgGrad.addColorStop(1, '#FFE8F2');
      }
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 720, 960);

      roundRect(ctx, 56, 64, 608, 832, 48);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.94)';
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#FFFFFF';
      ctx.stroke();

      ctx.fillStyle = '#373145';
      ctx.font = 'bold 28px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.fillText(`${APP_BRAND_NAME} • Monthly Recap`, 360, 145);

      ctx.fillStyle = '#756E87';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText(`Bulan ke-${state.monthCount}  •  Streak ${state.streak} Hari`, 360, 185);

      const serializer = new XMLSerializer();
      const svgString = serializer.serializeToString(svgEl);
      const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);
      const img = new Image();

      img.onload = function () {
        ctx.drawImage(img, 200, 215, 320, 295);
        URL.revokeObjectURL(url);

        ctx.fillStyle = '#373145';
        ctx.font = 'bold 36px Georgia, serif';
        ctx.textAlign = 'center';
        ctx.fillText(state.profile.name, 360, 560);

        ctx.fillStyle = '#DB2777';
        ctx.font = 'bold 22px sans-serif';
        ctx.fillText(`${activeAv.name} — ${stageInfo.label}`, 360, 602);

        const stats = [
          { val: `${avXp} XP`, lbl: 'XP Avatar' },
          { val: `${doneTasks}`, lbl: 'Tugas Selesai' },
          { val: `${doneHabits}/${state.habits.length}`, lbl: 'Habit Harian' }
        ];
        stats.forEach((st, i) => {
          const bx = 96 + i * 182;
          roundRect(ctx, bx, 645, 164, 120, 26);
          ctx.fillStyle = i === 1 ? '#FFE8F2' : '#E4F3FF';
          ctx.fill();

          ctx.fillStyle = '#373145';
          ctx.font = 'bold 30px sans-serif';
          ctx.fillText(st.val, bx + 82, 702);

          ctx.fillStyle = '#756E87';
          ctx.font = 'bold 17px sans-serif';
          ctx.fillText(st.lbl, bx + 82, 738);
        });

        ctx.fillStyle = '#756E87';
        ctx.font = 'bold 20px sans-serif';
        ctx.fillText(`Mood Dominan: ${moodLabel}  •  ${state.profile.username}`, 360, 825);

        ctx.fillStyle = '#9B94AD';
        ctx.font = 'italic 18px Georgia, serif';
        ctx.fillText(`"Grow a little brighter every day with ${APP_BRAND_NAME}"`, 360, 862);

        const link = document.createElement('a');
        link.download = `${APP_BRAND_NAME.toLowerCase()}-recap-bulan-${state.monthCount}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        showToast('Gambar Recap (.PNG) berhasil diunduh!');
      };

      img.src = url;
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function selectReadyAvatar(avatarId) {
      const chosen = READY_AVATARS.find((a) => a.id === avatarId);
      if (!chosen) return;
      state.readyAvatarId = chosen.id;
      state.avatarSpecies = chosen.species;
      state.xp = getAvatarXP(chosen.id);
      saveState();
      closeModal();
      renderApp();
      showToast(`Avatar "${chosen.name}" dipilih (${state.xp} XP)`);
    }

    function archiveAndStartNewMonth() {
      const activeAv = getActiveReadyAvatar();
      const avXp = getAvatarXP(activeAv.id);
      const stageInfo = getAvatarStage(avXp, activeAv.id);
      state.hallOfFame.unshift({
        month: state.monthCount,
        avatarId: activeAv.id,
        species: activeAv.species,
        name: activeAv.name,
        stage: stageInfo.stage,
        xp: avXp
      });
      state.monthCount += 1;
      state.avatarXpMap = createEmptyAvatarXpMap();
      state.xp = 0;
      saveState();
      closeModal();
      renderApp();
      showToast(`Avatar disimpan ke Koleksi! Selamat datang di Bulan ${state.monthCount}`);
    }

            <input id="newHabitTitle" class="pastel-input" type="text" required placeholder="Contoh: Jalan kaki 15 menit" />
          </div>
          <button type="submit" class="btn-gradient-main">+ Simpan Habit Harian</button>
        </form>

        <div style="display:flex;flex-direction:column;gap:8px;">
          ${state.habits.map(h => `
            <div class="soft-card" style="padding:12px 14px;display:flex;align-items:center;justify-content:space-between;">
              <div style="display:flex;align-items:center;gap:10px;">
                <div class="habit-icon-box">${getIcon(h.icon, 20)}</div>
                <span style="font-size:13.5px;font-weight:800;">${h.title}</span>
              </div>
              <button onclick="deleteHabit('${h.id}')" style="border:none;background:var(--primary-soft);color:var(--primary-deep);padding:6px 11px;border-radius:11px;font-size:11.5px;font-weight:800;cursor:pointer;">Hapus</button>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderChillTab() {
      if (state.memoryCards.length === 0) initMemoryGame(false);
      const pos = ensureRiddleQueuePosition();
      const currentRiddle = MINI_RIDDLES[(state.riddleIndex || 0) % MINI_RIDDLES.length];
      const activeAv = getActiveReadyAvatar();

      return `
        <div>
          <h2 class="editorial-heading">Chill Zone</h2>
          <p style="font-size:12.5px;color:var(--ink-muted);margin-top:3px;">Istirahat sejenak tanpa rasa bersalah sebelum lanjut fokus lagi.</p>
        </div>

        <section class="soft-card" style="text-align:center;background:linear-gradient(135deg,#FFFFFF 0%,var(--secondary-soft) 100%);">
          <span class="pill-tag pill-secondary">Timer Istirahat Lembut</span>
          <div id="breakTimerDisplay" class="editorial-heading" style="font-size:32px;margin:8px 0;letter-spacing:1px;">
            ${formatSeconds(state.breakSecondsLeft)}
          </div>
          <div style="display:flex;justify-content:center;gap:8px;">
            <button class="btn-gradient-main" onclick="toggleBreakTimer()">
              ${state.breakTimerRunning ? 'Jeda Timer' : 'Mulai Istirahat 5 Menit'}
            </button>
            <button class="btn-soft-secondary" onclick="resetBreakTimer()">Reset</button>
          </div>
        </section>

        <section class="soft-card" style="text-align:center;background:linear-gradient(135deg,var(--primary-soft) 0%,var(--tertiary-soft) 100%);">
          <span class="pill-tag pill-primary">${getIcon('wheel', 13)} Roda Aktivitas Santai</span>
          <p style="font-size:13.5px;font-weight:700;margin:10px 0 12px;min-height:38px;">${state.chillPrompt}</p>
          <button class="btn-soft-secondary" onclick="spinSelfCare()">Acak Ide Istirahat</button>
        </section>

        <section class="soft-card">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
            <div>
              <div style="font-size:14.5px;font-weight:800;">Mini Teka-Teki</div>
              <div style="font-size:11.5px;color:var(--ink-muted);">Jawab tebak-tebakan santai (+10 XP untuk ${activeAv.name})</div>
            </div>
            <span class="pill-tag pill-secondary">Terpecahkan: ${state.riddlesSolved || 0}</span>
          </div>

          <div class="riddle-card-box">
            <div class="riddle-meta-bar">
              <span class="pill-tag pill-primary">${getIcon('riddle', 12)} ${currentRiddle.category}</span>
              <span class="sec-meta">Dek Acak ${pos + 1}/${MINI_RIDDLES.length}</span>
            </div>
            <div class="riddle-question">${currentRiddle.question}</div>
            <form class="inline-form" onsubmit="checkMiniRiddle(event)">
              <input id="riddleAnswerInput" class="pastel-input" type="text" placeholder="Ketik jawabanmu di sini..." />
              <button type="submit" class="btn-gradient-main" style="white-space:nowrap;">Jawab</button>
            </form>
            <div id="riddleFeedbackText" class="riddle-feedback"></div>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border-soft);">
              <button type="button" class="mini-pill-btn" onclick="showMiniRiddleHint()">Petunjuk</button>
              <button type="button" class="mini-pill-btn" onclick="nextMiniRiddle()">Soal Berikutnya →</button>
            </div>
          </div>
        </section>

        <section class="soft-card">
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <div>
              <div style="font-size:14.5px;font-weight:800;">Kawaii Memory Match</div>
              <div style="font-size:11.5px;color:var(--ink-muted);">Cocokkan pasangan ikon pastel</div>
            </div>
            <button class="btn-soft-secondary" style="padding:6px 11px;font-size:11.5px;" onclick="initMemoryGame(true)">Acak Ulang</button>
          </div>
          <div class="memory-grid">
            ${state.memoryCards.map((iconName, idx) => {
              const isOpen = state.memoryFlipped.includes(idx) || state.memoryMatched.includes(idx);
              return `
                <button class="memory-tile ${isOpen ? 'open' : ''}" onclick="flipMemoryCard(${idx})">
                  ${isOpen ? getIcon(iconName, 24) : getIcon('star', 18)}
                </button>
              `;
            }).join('')}
          </div>
        </section>
      `;
    }

    // ============================================================
    // 10. SETTINGS TAB (ACCOUNT, EMAIL DB, 3 THEMES, GALLERY)
    // ============================================================
    function renderSettingsTab() {
      const themes = [
        { id: 'pinkblue', name: 'Soft Pink & Biru', swatch: 'linear-gradient(135deg,#89C4F4,#F472B6)' },
        { id: 'blue', name: 'Baby Blue Sky', swatch: 'linear-gradient(135deg,#A8D6FF,#4A90E2)' },
        { id: 'latte', name: 'Krem Cokelat', swatch: 'linear-gradient(135deg,#DFC2A6,#8C5832)' }
      ];
      const firstDayText = state.firstUseDate || getLocalDateStr(0);

      return `
        <div>
          <h2 class="editorial-heading">Akun & Pengaturan</h2>
          <p style="font-size:12.5px;color:var(--ink-muted);margin-top:3px;">Atur profilmu, tautkan email database, ganti tema warna, & lihat koleksi avatar.</p>
        </div>

        <form class="soft-card" style="display:flex;flex-direction:column;gap:10px;" onsubmit="saveProfileForm(event)">
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <span style="font-size:14.5px;font-weight:800;">Profil Akun</span>
            <span class="pill-tag pill-secondary">Mulai ${firstDayText}</span>
          </div>
          <div>
            <label style="font-size:11.5px;font-weight:800;color:var(--ink-muted);">Nama Panggilan</label>
            <input id="profName" class="pastel-input" type="text" value="${state.profile.name}" required />
          </div>
          <div>
            <label style="font-size:11.5px;font-weight:800;color:var(--ink-muted);">Username</label>
            <input id="profUsername" class="pastel-input" type="text" value="${state.profile.username}" />
          </div>
          <div>
            <label style="font-size:11.5px;font-weight:800;color:var(--ink-muted);">Bio Singkat</label>
            <input id="profBio" class="pastel-input" type="text" value="${state.profile.bio}" />
          </div>
          <button type="submit" class="btn-gradient-main">Simpan Profil Akun</button>
        </form>

        <form class="soft-card" style="display:flex;flex-direction:column;gap:10px;" onsubmit="linkEmailDatabase(event)">
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <span style="font-size:14.5px;font-weight:800;">Tautan Email & Database</span>
            <span class="pill-tag ${state.profile.email ? 'pill-primary' : 'pill-tertiary'}">
              ${state.profile.email ? 'Terhubung' : 'Mode Lokal'}
            </span>
          </div>
          <p style="font-size:11.5px;color:var(--ink-muted);">
            Tautkan email untuk menyimpan progres database terpisah per email serta menyiapkan ringkasan progres mingguan.
          </p>
          <input id="profEmail" class="pastel-input" type="email" value="${state.profile.email}" placeholder="nama@email.com" />
          <div class="btn-grid-2">
            <button type="submit" class="btn-soft-secondary">Simpan Email</button>
            <button type="button" class="btn-soft-secondary" onclick="sendEmailSummaryDraft()">Kirim Ringkasan</button>
          </div>
        </form>

        <section class="soft-card" style="display:flex;flex-direction:column;gap:10px;">
          <div style="font-size:14.5px;font-weight:800;">Tema Warna Aplikasi</div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">
            ${themes.map(th => `
              <button onclick="switchTheme('${th.id}')" style="padding:10px 6px;border-radius:18px;border:2px solid ${state.theme === th.id ? 'var(--primary-accent)' : 'var(--border-soft)'};background:${state.theme === th.id ? 'var(--primary-soft)' : '#FFFFFF'};cursor:pointer;text-align:center;font-family:inherit;">
                <div style="width:28px;height:28px;border-radius:999px;background:${th.swatch};margin:0 auto 6px;border:2px solid #FFFFFF;box-shadow:0 3px 8px rgba(0,0,0,0.12);"></div>
                <div style="font-size:11px;font-weight:800;color:var(--ink-dark);">${th.name}</div>
              </button>
            `).join('')}
          </div>

          <div style="display:flex;align-items:center;justify-content:space-between;padding-top:6px;border-top:1px solid var(--border-soft);">
            <span style="font-size:13px;font-weight:800;">Efek Suara Kawaii</span>
            <button class="btn-soft-secondary" style="padding:6px 12px;font-size:11.5px;" onclick="toggleSound()">
              ${state.soundEnabled ? 'Aktif (Bunyi)' : 'Mati (Senyap)'}
            </button>
          </div>
        </section>

        <section class="soft-card" style="display:flex;flex-direction:column;gap:10px;">
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <span style="font-size:14.5px;font-weight:800;">Koleksi Avatar Bulanan (${state.hallOfFame.length})</span>
            <button class="mini-pill-btn" onclick="openRecapModal()">${getIcon('recap', 13)} Kartu Recap</button>
          </div>
          ${state.hallOfFame.length === 0 ? `
            <p style="font-size:12px;color:var(--ink-muted);">Belum ada arsip bulanan. Klik tombol <strong>Avatar</strong> di halaman Home saat akhir bulan untuk menyimpan avatarmu ke galeri ini.</p>
          ` : `
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;">
              ${state.hallOfFame.map(item => `
                <div style="background:var(--bg-cream);border:1.5px solid var(--border-soft);border-radius:16px;padding:8px 4px;">
                  ${renderAvatarSVG(item.stage, item.species, 56, item.avatarId)}
                  <div style="font-size:11px;font-weight:800;margin-top:3px;">Bulan ${item.month}</div>
                  <div style="font-size:10px;color:var(--ink-muted);">${item.xp} XP</div>
                </div>
              `).join('')}
            </div>
          `}
        </section>

        <section class="soft-card" style="display:flex;flex-direction:column;gap:8px;">
          <div style="font-size:14px;font-weight:800;">Cadangan Data & Instal ke HP</div>
          <p style="font-size:11.5px;color:var(--ink-muted);">
            Streak dihitung otomatis sejak hari pertama dibuka (${firstDayText}) dan bertambah tiap hari berturut-turut.
          </p>
          <div class="btn-grid-2">
            <button class="btn-soft-secondary" onclick="exportBackupJSON()">Export Backup</button>
            <button onclick="resetDemoData()" style="padding:11px;border-radius:16px;border:1.5px solid var(--primary-mid);background:var(--primary-soft);color:var(--primary-deep);font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;">Reset Data</button>
          </div>
        </section>
      `;
    }

    // Settings Actions
    function saveProfileForm(e) {
      e.preventDefault();
      state.profile.name = document.getElementById('profName').value.trim() || 'Teman Fokus';
      state.profile.username = document.getElementById('profUsername').value.trim() || '@Qiu.user';
      state.profile.bio = document.getElementById('profBio').value.trim();
      saveState();
      renderApp();
      showToast('Profil akun berhasil disimpan!');
    }

    function linkEmailDatabase(e) {
      e.preventDefault();
      const email = document.getElementById('profEmail').value.trim();
      state.profile.email = email;
      saveState();
      renderApp();
      showToast(email ? `Database terhubung ke ${email}` : 'Email dilepas, kembali ke penyimpanan lokal');
    }

    function sendEmailSummaryDraft() {
      const email = state.profile.email;
      if (!email) {
        showToast('Masukkan & simpan alamat emailmu terlebih dahulu');
        return;
      }
      const activeAv = getActiveReadyAvatar();
      const avXp = getAvatarXP(activeAv.id);
      const doneTasks = state.tasks.filter(t => t.status === 'Selesai').length;
      const subject = encodeURIComponent(`Ringkasan Progres ${APP_BRAND_NAME} - Bulan ${state.monthCount}`);
      const body = encodeURIComponent(
        `Halo ${state.profile.name}!\n\nBerikut ringkasan progresmu di ${APP_BRAND_NAME}:\n- Avatar: ${activeAv.name} (${avXp} XP)\n- Streak Harian: ${state.streak} Hari\n- Tugas Selesai: ${doneTasks}\n\nTerus bertumbuh pelan-pelan ya!`
      );
      window.open(`mailto:${email}?subject=${subject}&body=${body}`, '_blank');
    }

    function switchTheme(themeId) {
      state.theme = themeId;
      document.body.setAttribute('data-theme', themeId);
      saveState();
      renderApp();
      showToast('Tema warna diperbarui');
    }

    function exportBackupJSON() {
      const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(state, null, 2));
      const link = document.createElement('a');
      link.setAttribute('href', dataStr);
      link.setAttribute('download', `${APP_BRAND_NAME.toLowerCase()}-backup.json`);
      link.click();
      showToast('File backup JSON berhasil diunduh');
    }

    function resetDemoData() {
      localStorage.removeItem(getAccountStorageKey(state.profile.email));
      const todayStr = getLocalDateStr(0);
      state = JSON.parse(JSON.stringify(defaultState));
      state.avatarXpMap = createEmptyAvatarXpMap();
      state.xp = 0;
      state.streak = 1;
      state.firstUseDate = todayStr;
      state.lastActiveDate = todayStr;
      state.riddleQueue = createShuffledRiddleQueue(null);
      state.riddleIndex = state.riddleQueue[0] || 0;
      document.body.setAttribute('data-theme', state.theme);
      saveState();
      renderApp();
      showToast('Data di-reset: Hari ke-1 & 0 XP tiap avatar');
    }

    // ============================================================
    // 11. NAVIGATION & INITIALIZATION
    // ============================================================
    function switchTab(tab) {
      state.activeTab = tab;
      saveState();
      renderApp();
    }

    function renderApp(animateCard = false) {
      syncDailyStreak(state);
      document.body.setAttribute('data-theme', state.theme || 'pinkblue');
      document.getElementById('brandNameDisplay').textContent = APP_BRAND_NAME;
      document.getElementById('headerGreeting').textContent = `Halo, ${state.profile.name}!`;
      document.getElementById('streakCount').textContent = state.streak;
      document.getElementById('streakBadgePill').title = `Streak Aktif (${state.streak} Hari sejak ${state.firstUseDate || getLocalDateStr(0)})`;
      document.getElementById('headerSoundBtn').innerHTML = getIcon(state.soundEnabled ? 'soundOn' : 'soundOff', 18);

      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === state.activeTab);
      });

      const main = document.getElementById('mainContent');
      if (state.activeTab === 'home') main.innerHTML = renderHomeTab(animateCard);
      else if (state.activeTab === 'todo') main.innerHTML = renderTodoTab();
      else if (state.activeTab === 'habits') main.innerHTML = renderHabitsTab();
      else if (state.activeTab === 'chill') main.innerHTML = renderChillTab();
      else if (state.activeTab === 'settings') main.innerHTML = renderSettingsTab();
    }

    window.onload = function () {
      syncDailyStreak(state);
      saveState();
      renderApp();
      checkDailyMoodPrompt();
    };
  </script>
</body>
</html>
